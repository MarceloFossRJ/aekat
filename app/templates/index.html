{% extends "base.html" %}
{% block main %}
    <div class="flex items-center justify-center h-screen container">
        <form action="/submit_search" method="post" class="relative w-full md:w-96">
          <label for="search" class="sr-only">Search</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none" onclick="this.form.submit();">
              <svg aria-hidden="true" class="w-5 h-5 text-gray-500 dark:text-gray-400"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
            </div>
            <input type="text" name="search" id="search"
              class="block w-full pl-10 pr-4 py-2.5 text-sm text-gray-900 border border-gray-300
                rounded-full bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:outline-none
                transition-all duration-200 dark:bg-gray-800 dark:border-gray-700
                dark:placeholder-gray-400 dark:text-white"
              placeholder="Search...">
          </div>
        </form>
        <p>Result: {{ search }}</p>
    </div>


{% endblock %}
